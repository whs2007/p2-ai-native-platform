# demo-repo 是 specflow 的离线演示仓库（只读）：不发布、不安装第三方依赖。
# 仅保留 pytest 配置，便于 /project-init 识别语言（Python）、包管理（pyproject/pip）
# 与测试命令（python -m pytest -q / pytest -q）。
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
